[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-jev"
version = "0.2.0"
description = "Research and engineering scaffold for multimodal Jev decision models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
assets = ["requests>=2.32,<3"]
sfc-eval = ["opencc-python-reimplemented==0.1.7", "regex>=2024.11.6,<2027"]

[project.urls]
Repository = "https://github.com/chaosxingxc-orion/multimodal-jev"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
